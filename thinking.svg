<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 28" width="120" height="26">
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        font-size: 14px;
        font-weight: 400;
      }
    </style>

    <linearGradient id="shimmer-light" x1="0%" y1="0%" x2="100%" y2="0%"
                    gradientUnits="userSpaceOnUse"
                    x="0" y="0" width="120" height="26">
      <stop offset="0%"   stop-color="#616161"/>
      <stop offset="50%"  stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#616161"/>
      <animateTransform attributeName="gradientTransform"
        type="translate"
        from="-120 0" to="120 0"
        dur="2s"
        repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="shimmer-dark" x1="0%" y1="0%" x2="100%" y2="0%"
                    gradientUnits="userSpaceOnUse"
                    x="0" y="0" width="120" height="26">
      <stop offset="0%"   stop-color="#9e9e9e"/>
      <stop offset="50%"  stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#9e9e9e"/>
      <animateTransform attributeName="gradientTransform"
        type="translate"
        from="-120 0" to="120 0"
        dur="2s"
        repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <text x="0" y="18"
        fill="url(#shimmer-light)"
        class="thinking-text light-text">Thinking...</text>

  <text x="0" y="18"
        fill="url(#shimmer-dark)"
        class="thinking-text dark-text">Thinking...</text>

  <style>
    @media (prefers-color-scheme: dark) {
      .light-text { display: none; }
      .dark-text  { display: block; }
    }
    @media (prefers-color-scheme: light) {
      .light-text { display: block; }
      .dark-text  { display: none; }
    }
  </style>
</svg>

